<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Michele Alletto | Contatto</title>

  <meta name="description" content="Contatti di Michele Alletto" />

  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #2a2f3a;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #222838 0, var(--bg) 45%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(23, 26, 33, 0.92);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 18px;
      background: #2a2f3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .role {
      margin: 8px 0 4px;
      color: var(--muted);
      font-size: 15px;
    }

    .company {
      margin: 0 0 26px;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    a.button {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.03);
    }

    a.button.primary {
      background: var(--accent);
      color: #0f1115;
      border-color: var(--accent);
      font-weight: 700;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (hover: hover) {
      a.button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      a.button.primary:hover {
        opacity: 0.9;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">MA</div>

    <h1>Michele Alletto</h1>
    <p class="role">Founder &amp; CTO</p>
    <p class="company">Deep4IT</p>

    <div class="actions">
      <a class="button primary" href="./michele.vcf">
        Salva contatto
      </a>

      <a class="button" href="mailto:michele.alletto@deep4it.com">
        Email
      </a>

      <a class="button" href="tel:+393208789789">
        Telefono
      </a>

      <a class="button" href="https://wa.me/393208789789">
        WhatsApp
      </a>

      <a class="button" href="https://www.linkedin.com/in/michelealletto/">
        LinkedIn
      </a>

      <a class="button" href="https://deep4it.com">
        Sito web
      </a>
    </div>

    <p class="footer">
      Scansiona il QR code per aprire questa pagina.
    </p>
  </main>
</body>
</html>
